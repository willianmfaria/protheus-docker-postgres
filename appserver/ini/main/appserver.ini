[DEV]
ROOTPATH=/opt/totvs/protheus/protheus_data/
SOURCEPATH=/opt/totvs/protheus/apo/dev
RPOCUSTOM=/opt/totvs/protheus/apo/dev/custom.rpo
STARTPATH=/system/
RPODB=top
RPOLANGUAGE=multi
RPOVERSION=120
TRACE=0
DBDATABASE=POSTGRES
DBSERVER=dbaccess
DBALIAS=Protheus
DBPORT=7890
TOPMEMOMEGA=1
FWTRACELOG=1
STARTSYSINDB=1

[DEV2]
ROOTPATH=/opt/totvs/protheus/protheus_data/
SOURCEPATH=/opt/totvs/protheus/apo/dev2
RPOCUSTOM=/opt/totvs/protheus/apo/dev2/custom_dev2.rpo
STARTPATH=/system/
RPODB=top
RPOLANGUAGE=multi
RPOVERSION=120
TRACE=0
DBDATABASE=POSTGRES
DBSERVER=dbaccess
DBALIAS=Protheus
DBPORT=7890
TOPMEMOMEGA=1
FWTRACELOG=1
STARTSYSINDB=1

[DRIVERS]
ACTIVE=TCP
MULTIPROTOCOLPORT=1
MULTIPROTOCOLPORTSECURE=1

[TCP]
TYPE=tcpip
PORT=9999

[TOPCONNECT]
DATABASE=POSTGRES
ALIAS=Protheus

[GENERAL]
CONSOLELOG=1
CONSOLEFILE=console.log
BUILDKILLUSERS=1
APP_ENVIRONMENT=DEV
APP_ENVIRONMENT_EXTRA=DEV,DEV2
MAXSTRINGSIZE=10
GUESTKILLUSER=1

[LOCKSERVER]
ENABLE=0
SERVER=NOCONFIG

[LICENSECLIENT]
SERVER=license
PORT=5555
LOGMESSAGES=0

[MAIL]
PROTOCOL=SMTP
EXTENDSMTP=1
AUTHLOGIN=1
AUTHNTLM=1
TLSVERSION=1
SSLVERSION=3
TRYPROTOCOLS=0

[WEBAPP]
ENABLE=1
PORT=8080
ENVSERVER=DEV,DEV2
LASTMAINPROG=SIGAMDI,SIGACFG,APSDU