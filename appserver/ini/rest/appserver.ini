[DEV]
ROOTPATH=/opt/totvs/protheus/protheus_data/
SOURCEPATH=/opt/totvs/protheus/apo/rest
RPOCUSTOM=/opt/totvs/protheus/apo/rest/custom_rest.rpo
STARTPATH=/system/
RPODB=top
RPOLANGUAGE=multi
RPOVERSION=120
TRACE=0
DBDATABASE=POSTGRES
DBSERVER=dbaccess
DBALIAS=Protheus
DBPORT=7890
TOPMEMOMEGA=1
FWTRACELOG=1
STARTSYSINDB=1

[TCP]
TYPE=tcpip
PORT=9998

[TOPCONNECT]
DATABASE=POSTGRES
ALIAS=Protheus

[DRIVERS]
ACTIVE=TCP

[GENERAL]
MAXSTRINGSIZE=10
BUILDKILLUSERS=1
GUESTKILLUSER=1
CONSOLELOG=1
CONSOLEFILE=console.log

[LOCKSERVER]
ENABLE=0
SERVER=NOCONFIG

[LICENSECLIENT]
SERVER=license
PORT=5555
LOGMESSAGES=0

; REST
[ONSTART]
JOBS=HTTPJOB
REFRESHRATE=120

[HTTPJOB]
MAIN=HTTP_START
ENVIRONMENT=DEV

[HTTPV11]
ENABLE=1
SOCKETS=HTTPREST
ADVPL=0

[HTTPREST]
PORT=3000
URIS=HTTPURI
SECURITY=1

[HTTPURI]
URL=/rest
PREPAREIN=ALL
INSTANCES=1,2
CORSENABLE=1
ALLOWORIGIN=*

[MAIL]
PROTOCOL=SMTP
EXTENDSMTP=1
AUTHLOGIN=1
AUTHNTLM=1
TLSVERSION=1
SSLVERSION=3
TRYPROTOCOLS=0